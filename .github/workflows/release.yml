name: CI

on:
  release:
    types: [created]

# This workflow only reads the repository; publishing authenticates with the
# soldeer credentials, not GITHUB_TOKEN. Dropping the token to read-only keeps a
# compromised build step from pushing commits, tags, or releases.
permissions:
  contents: read

jobs:
  package:

    name: Soldeer Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: abstract-foundation/foundry-toolchain-zksync@v1

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge build zksync
        run: |
          forge build --zksync
        id: build-zksync
    
      - name: Publish to soldeer.xyz
        env:
          SOLDEER_EMAIL: ${{ secrets.SOLDEER_EMAIL }}
          SOLDEER_PASSWORD: ${{ secrets.SOLDEER_PASSWORD }}
          # Pass the tag through the environment instead of interpolating
          # ${{ github.ref_name }} into the script. Tag names may contain shell
          # metacharacters, which would otherwise execute in a step that holds the
          # soldeer publish credentials.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          forge soldeer login --email "$SOLDEER_EMAIL" --password "$SOLDEER_PASSWORD"
          VERSION=`echo "$RELEASE_TAG" | sed 's/v//'`
          forge soldeer push --skip-warnings absmate~$VERSION
